problem:
  name: "Reverse Words"
  topic: "Strings"
  difficulty: "beginner"
  description: >
    Given a sentence, reverse the order of words.
    
    Input format:
      A single line containing a sentence
    
    Output format:
      The sentence with words in reverse order
    
    Example:
      Input:  "hello world foo"
      Output: "foo world hello"
  languages: [python, c, cpp, java]
  time_limit: 5

scoring:
  total_points: 4

hints:
  general: "Try splitting the sentence into words, then reversing the list!"
